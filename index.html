<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APEX WEB3 Verification</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #05070b;
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    background: #0c1018;
    border: 1px solid #252d3a;
    border-radius: 22px;
    padding: 32px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.logo span {
    color: #d6a84f;
}

.subtitle {
    text-align: center;
    color: #8e98a8;
    font-size: 14px;
    margin-bottom: 30px;
}

.badge {
    display: block;
    width: max-content;
    margin: 0 auto 25px;
    padding: 7px 14px;
    border-radius: 30px;
    background: #151b25;
    border: 1px solid #303a4a;
    font-size: 12px;
    color: #d6a84f;
}

label {
    display: block;
    font-size: 13px;
    color: #aeb7c5;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #303846;
    background: #070a10;
    color: #fff;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #d6a84f;
}

button {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: #d6a84f;
    color: #080a0e;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #080c12;
    border: 1px solid #26303d;
}

.verified {
    color: #58d68d;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}

.notverified {
    color: #ff6b6b;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}

.details {
    color: #aeb7c5;
    font-size: 14px;
    line-height: 1.8;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 11px;
    color: #657080;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        APEX <span>WEB3</span>
    </div>

    <div class="subtitle">
        Official APEX WEB3 Agency Verification Portal
    </div>

    <div class="badge">
        SECURE VERIFICATION
    </div>

    <label for="username">
        Enter Telegram or X Username
    </label>

    <input
        id="username"
        type="text"
        placeholder="@username"
        autocomplete="off"
    >

    <button type="button" id="verifyButton">VERIFY ACCOUNT</button>

    <div id="result" class="result"></div>

    <div class="footer">
        Check if a Telegram or X (Twitter) username is officially verified by APEX WEB3 Agency.
    </div>

</div>

<script>
const SUPABASE_URL = "https://bpcqvztdfldmcnqnptkj.supabase.co";
const SUPABASE_KEY = "sb_publishable_zoG2adG4yayyfYgchWxqdA_-Q4kNhkI";

const button = document.getElementById("verifyButton");
const input = document.getElementById("username");
const result = document.getElementById("result");

button.addEventListener("click", async function () {

    result.style.display = "block";
    result.innerHTML = `
        <div style="color:#d6a84f;font-size:18px;font-weight:bold;">
        CHECKING...
        </div>
    `;

    let username = input.value.trim().replace(/^@+/, "");

    if (!username) {
        result.innerHTML = `
            <div class="notverified">⚠ Please enter a username</div>
        `;
        return;
    }

    button.disabled = true;
    button.innerText = "VERIFYING...";

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/verified_accounts" +
            "?telegram_username=ilike." +
            encodeURIComponent(username) +
            "&select=channel_name,telegram_username,status";

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        });

        if (!response.ok) {
            throw new Error("Database request failed");
        }

        let data = await response.json();

        if (data.length === 0) {
            const url2 =
                SUPABASE_URL +
                "/rest/v1/verified_accounts" +
                "?telegram_username=ilike." +
                encodeURIComponent("@" + username) +
                "&select=channel_name,telegram_username,status";

            const response2 = await fetch(url2, {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            });

            data = await response2.json();
        }

        if (data.length > 0) {

            const user = data[0];
            const status = String(user.status || "")
                .toLowerCase()
                .trim();

            if (status.includes("verified")) {

                result.innerHTML = `
                    <div class="verified">✓ VERIFIED</div>
                    <div class="details">
                        <b>Username:</b> ${escapeHTML(user.telegram_username)}<br>
                        <b>Channel:</b> ${escapeHTML(user.channel_name)}<br>
                        <b>Status:</b> Verified
                    </div>
                `;

            } else {

                result.innerHTML = `
                    <div class="notverified">✕ NOT VERIFIED</div>
                    <div class="details">
                        Account found, but verification is not active.
                    </div>
                `;
            }

        } else {

            result.innerHTML = `
                <div class="notverified">✕ NOT VERIFIED</div>
                <div class="details">
                    No record found for @${escapeHTML(username)}
                </div>
            `;
        }

    } catch (error) {

        console.error(error);

        result.innerHTML = `
            <div class="notverified">⚠ DATABASE ERROR</div>
            <div class="details">
                Unable to connect to verification database.
            </div>
        `;

    } finally {

        button.disabled = false;
        button.innerText = "VERIFY ACCOUNT";
    }
});

function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        button.click();
    }
});
</script>

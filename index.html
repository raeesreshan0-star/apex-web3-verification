<script>

const SUPABASE_URL = "https://bpcqvztdfldmcnqnptkj.supabase.co";
const SUPABASE_KEY = "sb_publishable_zoG2adG4yayyfYgchWxqdA_-Q4kNhkI";

async function checkUsername(username) {

    const url =
        `${SUPABASE_URL}/rest/v1/verified_accounts` +
        `?telegram_username=eq.${encodeURIComponent(username)}` +
        `&select=channel_name,telegram_username,status`;

    const response = await fetch(url, {
        method: "GET",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
        }
    });

    if (!response.ok) {
        const error = await response.text();
        console.error("Supabase Error:", error);
        throw new Error("Database error");
    }

    return await response.json();
}

async function verifyUser() {

    const input = document.getElementById("username");
    const result = document.getElementById("result");
    const button = document.getElementById("verifyButton");

    let username = input.value
        .trim()
        .replace(/^@+/, "")
        .toLowerCase();

    if (!username) {
        result.style.display = "block";
        result.innerHTML = `
            <div class="notverified">
                ⚠ Please enter a username
            </div>
        `;
        return;
    }

    button.disabled = true;
    button.innerText = "VERIFYING...";

    try {

        // Check username without @
        let data = await checkUsername(username);

        // If not found, check username with @
        if (data.length === 0) {
            data = await checkUsername("@" + username);
        }

        result.style.display = "block";

        if (data.length > 0) {

            const user = data[0];

            // Accept verified status regardless of capitalization
            if (String(user.status).toLowerCase() === "verified") {

                result.innerHTML = `
                    <div class="verified">
                        ✓ VERIFIED
                    </div>

                    <div class="details">
                        <b>Username:</b> ${user.telegram_username}<br>
                        <b>Channel:</b> ${user.channel_name}<br>
                        <b>Status:</b> Verified
                    </div>
                `;

            } else {

                result.innerHTML = `
                    <div class="notverified">
                        ✕ NOT VERIFIED
                    </div>

                    <div class="details">
                        Account found, but its verification status is not active.
                    </div>
                `;
            }

        } else {

            result.innerHTML = `
                <div class="notverified">
                    ✕ NOT VERIFIED
                </div>

                <div class="details">
                    No verified record was found for <b>@${username}</b>.
                </div>
            `;
        }

    } catch (error) {

        console.error(error);

        result.style.display = "block";

        result.innerHTML = `
            <div class="notverified">
                ⚠ Verification Error
            </div>

            <div class="details">
                Unable to connect to the verification database.
            </div>
        `;

    } finally {

        button.disabled = false;
        button.innerText = "VERIFY ACCOUNT";

    }
}

</script>
